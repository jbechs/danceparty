<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dance party</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#111;
      color:#fff;
      font-family:'Inter', system-ui, sans-serif;
    }

    .container{
      width:min(90vw,420px);
      display:grid;
      gap:16px;
      text-align:center;
    }

    .header{
      display:grid;
      gap:6px;
      margin-bottom:28px;
    }

    h1{
      margin:0;
      font-size:1.8rem;
      letter-spacing:.04em;
      font-weight:600;
    }

    .subtitle{
      font-size:.9rem;
      color:#aaa;
    }

    label{
      font-size:.95rem;
    }

    input, button{
      font-size:1rem;
      padding:12px;
      border-radius:8px;
      border:none;
    }

    input{
      background:#222;
      color:#fff;
    }

    button{
      background:#fff;
      color:#111;
      font-weight:600;
      cursor:pointer;
      min-width:140px;
      justify-self:center;
    }

    button:disabled{
      cursor:default;
    }

    .startNow{
      font-size:1.15rem;
      padding:16px;
    }

    .status{
      min-height:1.4em;
      color:#bbb;
    }

    .countdown{
      min-height:1.4em;
      font-size:1.2rem;
      font-weight:600;
    }

    .transport{
      min-height:1.4em;
      font-size:1rem;
      color:#fff;
      font-variant-numeric:tabular-nums;
    }

    .debug{
      font-size:.82rem;
      color:#777;
      min-height:1.2em;
      word-break:break-word;
    }

    .diagnosticsToggle{
      width:100%;
      min-width:0;
      padding:8px 12px;
      border-radius:6px;
      background:#131313;
      color:#242424;
      font-size:.72rem;
      font-weight:400;
      letter-spacing:.03em;
      justify-self:stretch;
    }

    .diagnosticsPanel{
      display:grid;
      gap:6px;
    }

    .timingProbe{
      font-size:.76rem;
      color:#666;
      line-height:1.4;
      word-break:break-word;
    }

    .diagnosticsPanel.hidden{
      display:none;
    }

    .hidden{
      display:none;
    }

    audio{
      width:100%;
    }

    input[type="datetime-local"]{
      color:#fff;
      background:#222;
    }

    input[type="datetime-local"]::-webkit-calendar-picker-indicator{
      filter:invert(1);
    }


    /* COMMON GLOW variation: full-screen luminous crowd object.
       Presentation-only layer: playback/sync logic remains unchanged. */
    #glowScreen{
      position:fixed;
      inset:-3px;
      width:calc(100dvw + 6px);
      height:calc(100dvh + 6px);
      min-height:calc(100svh + 6px);
      z-index:1000;
      overflow:hidden;
      background:#020207;
      opacity:0;
      visibility:hidden;
      transition:opacity 700ms ease;
      touch-action:manipulation;
      user-select:none;
      -webkit-user-select:none;
    }

    #glowScreen.active{
      opacity:1;
      visibility:visible;
    }

    #glowCanvas{
      width:100%;
      height:100%;
      display:block;
      filter:saturate(1.18) contrast(1.05);
    }

    #glowVignette{
      position:absolute;
      inset:0;
      pointer-events:none;
      /* Keep the perimeter alive: this is intentionally a glow frame, not a dark vignette. */
      background:radial-gradient(circle at 50% 47%, transparent 0 38%, rgba(255,255,255,.015) 58%, rgba(255,255,255,.075) 100%);
      mix-blend-mode:screen;
    }

    #glowResume{
      position:absolute;
      left:50%;
      bottom:max(8vh,32px);
      transform:translateX(-50%);
      z-index:2;
      width:min(78vw,320px);
      padding:15px 18px;
      border:1px solid rgba(255,255,255,.42);
      border-radius:999px;
      color:white;
      background:rgba(0,0,0,.42);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      box-shadow:0 0 30px rgba(255,255,255,.12);
    }

    #glowResume.hidden{ display:none; }

    #glowCountdown{
      position:absolute;
      inset:0;
      z-index:1;
      display:grid;
      place-items:center;
      pointer-events:none;
      font-family:'Inter', system-ui, sans-serif;
      font-size:clamp(4.5rem, 24vw, 11rem);
      font-weight:600;
      letter-spacing:-0.045em;
      line-height:1;
      font-variant-numeric:tabular-nums;
      color:rgba(255,255,255,.94);
      text-shadow:0 0 18px rgba(255,255,255,.18), 0 0 54px rgba(255,255,255,.10);
      opacity:0;
      transition:opacity 220ms ease;
    }

    #glowCountdown.visible{ opacity:1; }

  </style>
</head>

<body>

  <div id="glowScreen" aria-hidden="true">
    <canvas id="glowCanvas"></canvas>
    <div id="glowVignette"></div>
    <div id="glowCountdown" aria-hidden="true"></div>
    <button id="glowResume" class="hidden" type="button">Tap to resume sound</button>
  </div>

  <main class="container">
    <div class="header">
      <h1>makeshift dance party</h1>
      <div class="subtitle">crank your phones + turn off the lights</div>
    </div>

    <label for="startTime">Start Time</label>
    <input id="startTime" type="datetime-local" step="60" />

    <button id="playButton">Begin</button>
    <button id="startNowButton" class="startNow hidden">Begin</button>

    <div id="countdown" class="countdown"></div>
    <div id="status" class="status">Ready.</div>
    <div id="transport" class="transport">00:00 / 00:00 · drift 0 ms</div>
    <button id="diagnosticsToggle" class="diagnosticsToggle" type="button" aria-expanded="false">info</button>
    <div id="diagnosticsPanel" class="diagnosticsPanel hidden">
      <div id="driftStats" class="debug">Initial — · Avg — · Best — · Worst —<br>Hard seeks 0 · Last —</div>
      <div id="timingProbe" class="timingProbe">Timing probe — waiting for playback</div>
      <div id="debug" class="debug"></div>
    </div>

    <audio id="audio" preload="auto" playsinline class="hidden"></audio>
    <audio id="preshowAudio" preload="auto" playsinline loop class="hidden"></audio>
  </main>

  <script> 
    const AUDIO_URL = "https://eggtooth.xyz/Life.mp3";
    const PRESHOW_AUDIO_URL = "https://eggtooth.xyz/quietWind.mp3";
    const TIME_SERVER_URL = "https://sync1.jbechs.workers.dev/";

    const audio = document.getElementById("audio");
    const preshowAudio = document.getElementById("preshowAudio");
    const playButton = document.getElementById("playButton");
    const startNowButton = document.getElementById("startNowButton");
    const startInput = document.getElementById("startTime");
    const statusEl = document.getElementById("status");
    const countdownEl = document.getElementById("countdown");
    const diagnosticsToggle = document.getElementById("diagnosticsToggle");
    const diagnosticsPanel = document.getElementById("diagnosticsPanel");
    const transportEl = document.getElementById("transport");
    const driftStatsEl = document.getElementById("driftStats");
    const timingProbeEl = document.getElementById("timingProbe");
    const debugEl = document.getElementById("debug");

    // --- COMMON GLOW presentation layer ---------------------------------
    // A local canvas animation that turns every participant phone into a
    // luminous object. It never drives audio or modifies the show clock.
    const glowScreen = document.getElementById("glowScreen");
    const glowCanvas = document.getElementById("glowCanvas");
    const glowCtx = glowCanvas.getContext("2d", { alpha:false });
    const glowResume = document.getElementById("glowResume");
    const glowCountdown = document.getElementById("glowCountdown");
    let glowActive = false;
    let glowFrame = null;
    let glowTapTimes = [];

    // A tiny per-device phase difference keeps a crowd visually alive while
    // cue changes remain synchronized. Session-scoped; no storage or identity.
    const glowVariant = Math.random();

    // MUSIC-DRIVEN DANCE PARTY VISUALS ----------------------------------
    // Beat grid measured from Life.mp3: ~123.046875 BPM, first beat ~0.06966 s.
    // Everything below is calculated from media time, so late joins land in phase.
    const TRACK_BPM = 123.046875;
    const TRACK_BEAT_ZERO_SEC = 0.069659864;
    const TRACK_BEAT_SEC = 60 / TRACK_BPM;

    // Each participant gets exactly one visual identity for this page load.
    // The three tribes share musical choreography but occupy distinct color worlds.
    const GLOW_PALETTES = [
      { name:'ultraviolet', a:198, b:302, c:258, edge:188 }, // cyan / violet / indigo
      { name:'acid',        a:92,  b:184, c:218, edge:72  }, // acid green / turquoise / electric blue
      { name:'solar',       a:18,  b:342, c:48,  edge:4   }  // amber / hot pink-red / gold
    ];
    const glowPaletteIndex = Math.floor(Math.random() * GLOW_PALETTES.length);
    const glowPalette = GLOW_PALETTES[glowPaletteIndex];

    // Section energies follow the analyzed contour of Life.mp3 rather than arbitrary timing.
    // hueShift rotates within each tribe while preserving its overall identity.
    const GLOW_CUES = [
      { t:0,     e:.74, hueShift:0,   bloom:.15 },
      { t:16,    e:.94, hueShift:10,  bloom:.35 },
      { t:30,    e:.84, hueShift:26,  bloom:.22 },
      { t:55.5,  e:.42, hueShift:-8,  bloom:.08 }, // major drop / air
      { t:68,    e:.66, hueShift:8,   bloom:.14 },
      { t:76,    e:1.00,hueShift:20,  bloom:.40 }, // strong peak
      { t:92,    e:.78, hueShift:38,  bloom:.22 },
      { t:100,   e:1.00,hueShift:52,  bloom:.46 }, // strong peak
      { t:111.5, e:.43, hueShift:0,   bloom:.08 }, // second breakdown
      { t:124,   e:.52, hueShift:-18, bloom:.10 },
      { t:142,   e:.70, hueShift:12,  bloom:.18 },
      { t:155,   e:.92, hueShift:30,  bloom:.34 },
      { t:171,   e:.98, hueShift:48,  bloom:.40 },
      { t:184,   e:1.00,hueShift:66,  bloom:.50 }, // final sustained peak
      { t:196,   e:.78, hueShift:82,  bloom:.34 },
      { t:202.64,e:.20, hueShift:96,  bloom:.05 }
    ];

    let glowTiltX = 0;
    let glowTiltY = 0;
    let glowMotionEnabled = false;

    function handleGlowOrientation(ev){
      // Clamp and low-pass so the image feels liquid rather than twitchy.
      const gamma = Math.max(-35, Math.min(35, Number(ev.gamma) || 0)) / 35;
      const beta = Math.max(-35, Math.min(35, (Number(ev.beta) || 0) - 45)) / 35;
      glowTiltX += (gamma - glowTiltX) * .12;
      glowTiltY += (beta - glowTiltY) * .12;
    }

    function enableGlowMotion(){
      if(glowMotionEnabled) return;
      glowMotionEnabled = true;
      window.addEventListener('deviceorientation', handleGlowOrientation, { passive:true });
    }

    function requestGlowMotionAccess(){
      // iOS exposes permission only from a user gesture; Android/Chrome generally does not require it.
      try{
        if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function'){
          const result = DeviceOrientationEvent.requestPermission();
          if(result && typeof result.then === 'function'){
            result.then(state=>{ if(state === 'granted') enableGlowMotion(); }).catch(()=>{});
          }
        }else{
          enableGlowMotion();
        }
      }catch(_err){
        // Motion is optional; never interfere with playback.
      }
    }

    function beatStateAt(t){
      const beatFloat = (t - TRACK_BEAT_ZERO_SEC) / TRACK_BEAT_SEC;
      const beatIndex = Math.floor(beatFloat);
      const phase = beatFloat - beatIndex;
      // Quick luminous attack with a gentle decay over one beat.
      const pulse = phase < 0 ? 0 : Math.exp(-phase * 5.2);
      const phraseBeat = ((beatIndex % 16) + 16) % 16;
      const phraseHit = phraseBeat === 0 ? Math.exp(-Math.max(0, phase) * 7.5) : 0;
      return { beatIndex, phase, pulse, phraseHit };
    }

    function resizeGlow(){
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, window.innerWidth);
      const h = Math.max(1, window.innerHeight);
      glowCanvas.width = Math.round(w * dpr);
      glowCanvas.height = Math.round(h * dpr);
      glowCanvas.style.width = `${w}px`;
      glowCanvas.style.height = `${h}px`;
      glowCtx.setTransform(dpr,0,0,dpr,0,0);
    }

    // Best-effort fullscreen enhancement. This MUST be invoked directly from
    // the audience's Begin gesture; browsers may reject it, in which case the
    // fixed glow layer still fills the available viewport and playback continues.
    function requestGlowFullscreen(){
      try{
        const el = document.documentElement;
        const request =
          el.requestFullscreen ||
          el.webkitRequestFullscreen ||
          el.webkitRequestFullScreen ||
          el.msRequestFullscreen;

        if(typeof request === "function"){
          const result = request.call(el);
          if(result && typeof result.catch === "function"){
            result.catch(()=>{});
          }
        }
      }catch(_err){
        // Fullscreen is optional by design. Never interfere with the show.
      }
    }

    function glowTrackTime(){
      // During performance the media playhead is the visual clock. Before an
      // on-time scheduled curtain, show a slow ambient field instead.
      if(!audio.paused && isFinite(audio.currentTime)) return audio.currentTime;
      if(scheduledAnchorMs != null && performanceClockFrozen){
        const expected = getExpectedTrackTimeSec();
        if(expected != null && expected >= 0) return expected;
      }
      return 0;
    }

    function cueAt(t){
      let c = GLOW_CUES[0];
      for(let i=1;i<GLOW_CUES.length;i++){
        if(t < GLOW_CUES[i].t) break;
        c = GLOW_CUES[i];
      }
      return c;
    }

    function sectionTransitionStrength(t){
      let strength = 0;
      for(let i=1;i<GLOW_CUES.length-1;i++){
        const dt = t - GLOW_CUES[i].t;
        if(dt >= 0 && dt < .9){
          strength = Math.max(strength, (1 - dt/.9) * GLOW_CUES[i].bloom);
        }
      }
      return strength;
    }

    function hsl(h,s,l,a=1){
      return `hsla(${((h%360)+360)%360} ${s}% ${l}% / ${a})`;
    }

    function drawPreshowWind(nowMs, w, h){
      // Preshow visual world: deliberately restrained and nearly monochrome.
      // Abstract drifting currents suggest the quiet wind bed without competing
      // with the saturated three-tribe reveal when the dance track begins.
      const clock = nowMs / 1000;
      const phase = glowVariant * Math.PI * 2;
      const tx = glowTiltX * w * .035;
      const ty = glowTiltY * h * .025;
      const breath = .5 + .5 * Math.sin(clock * .16 + phase);

      glowCtx.globalCompositeOperation = 'source-over';
      glowCtx.fillStyle = '#07090c';
      glowCtx.fillRect(0,0,w,h);

      // Long soft currents drift horizontally at different speeds and heights.
      glowCtx.globalCompositeOperation = 'screen';
      const currents = [
        { y:.26, speed:.026, width:.88, height:.17, light:26, alpha:.15 },
        { y:.48, speed:-.019, width:1.02, height:.22, light:32, alpha:.12 },
        { y:.70, speed:.014, width:.92, height:.19, light:22, alpha:.13 },
        { y:.39, speed:-.010, width:.62, height:.12, light:40, alpha:.075 }
      ];

      for(let i=0;i<currents.length;i++){
        const c=currents[i];
        const wrap = w * 1.75;
        const raw = ((clock * c.speed * w + phase * 53 + i * w * .41) % wrap + wrap) % wrap;
        const x = raw - w*.48 + tx;
        const y = h*c.y + Math.sin(clock*.10 + phase + i*1.7)*h*.035 + ty;
        const rx = w*c.width;
        const ry = h*c.height*(.88 + .14*breath);
        const g=glowCtx.createRadialGradient(x,y,0,x,y,Math.max(rx,ry));
        g.addColorStop(0, `hsla(210 16% ${c.light}% / ${c.alpha})`);
        g.addColorStop(.38, `hsla(205 13% ${Math.max(10,c.light-5)}% / ${c.alpha*.62})`);
        g.addColorStop(1, 'hsla(210 12% 10% / 0)');
        glowCtx.fillStyle=g;
        glowCtx.save();
        glowCtx.translate(x,y);
        glowCtx.scale(1, ry/rx);
        glowCtx.beginPath();
        glowCtx.arc(0,0,rx,0,Math.PI*2);
        glowCtx.fill();
        glowCtx.restore();
      }

      // A faint roaming veil keeps the screen alive without reading as colorful.
      const vx=w*(.50 + .18*Math.sin(clock*.055 + phase*.7)) + tx*.5;
      const vy=h*(.50 + .12*Math.cos(clock*.047 + phase)) + ty*.5;
      const vr=Math.max(w,h)*.72;
      const veil=glowCtx.createRadialGradient(vx,vy,0,vx,vy,vr);
      veil.addColorStop(0, `rgba(205,215,225,${.035 + .025*breath})`);
      veil.addColorStop(.55, 'rgba(150,165,180,.018)');
      veil.addColorStop(1, 'rgba(120,140,160,0)');
      glowCtx.fillStyle=veil;
      glowCtx.fillRect(0,0,w,h);

      // Very subtle edge lift: enough to feel like an object, not a webpage.
      const edge=glowCtx.createRadialGradient(w*.5,h*.5,Math.min(w,h)*.30,w*.5,h*.5,Math.max(w,h)*.78);
      edge.addColorStop(0,'rgba(185,200,215,0)');
      edge.addColorStop(.78,'rgba(185,200,215,.008)');
      edge.addColorStop(1,'rgba(185,200,215,.055)');
      glowCtx.fillStyle=edge;
      glowCtx.fillRect(0,0,w,h);
    }

    function drawLavaLamp(trackT, cue, beat, breath, clock, phase, energy, w, h){
      // Base dance language: slow viscous lava-lamp bodies that pulse on the beat.
      glowCtx.globalCompositeOperation='source-over';
      glowCtx.fillStyle=hsl(cue.a+18, 70, 3 + 3*energy, 1);
      glowCtx.fillRect(0,0,w,h);

      const bodies=[];
      for(let i=0;i<7;i++){
        const speed=.06 + i*.012;
        const wobble=clock*speed + phase*(.7+i*.13) + i*1.31;
        const x=.5 + .34*Math.sin(wobble*1.13 + Math.sin(wobble*.41));
        const y=.5 + .38*Math.cos(wobble*.91 + i*.7);
        const rx=(.18 + .055*Math.sin(wobble*.73+i))*Math.max(w,h)*(1+.10*beat);
        const ry=rx*(.62 + .20*Math.sin(wobble*.57+i*.9));
        bodies.push({x:x*w,y:y*h,rx,ry,hue:i%2?cue.a:cue.b});
      }

      glowCtx.globalCompositeOperation='screen';
      for(const b of bodies){
        glowCtx.save();
        glowCtx.translate(b.x,b.y);
        glowCtx.scale(1,b.ry/b.rx);
        const g=glowCtx.createRadialGradient(0,0,0,0,0,b.rx);
        g.addColorStop(0,hsl(b.hue+18*beat,98,68,.90*energy));
        g.addColorStop(.32,hsl(b.hue,96,56,.70*energy));
        g.addColorStop(.72,hsl(b.hue-22,92,38,.22*energy));
        g.addColorStop(1,hsl(b.hue,90,26,0));
        glowCtx.fillStyle=g;
        glowCtx.beginPath();
        glowCtx.arc(0,0,b.rx,0,Math.PI*2);
        glowCtx.fill();
        glowCtx.restore();
      }

      // Viscous central merge/split field.
      const cx=w*(.5+.08*Math.sin(clock*.09+phase));
      const cy=h*(.5+.08*Math.cos(clock*.08+phase));
      const r=Math.min(w,h)*(.22+.035*beat+.025*breath);
      const core=glowCtx.createRadialGradient(cx,cy,0,cx,cy,r*2.8);
      core.addColorStop(0,`rgba(255,255,255,${.26+.20*beat})`);
      core.addColorStop(.18,hsl(cue.a+32,92,74,.56));
      core.addColorStop(.52,hsl(cue.b,100,58,.34));
      core.addColorStop(1,hsl(cue.b,100,50,0));
      glowCtx.fillStyle=core;
      glowCtx.beginPath(); glowCtx.arc(cx,cy,r*2.8,0,Math.PI*2); glowCtx.fill();
    }

    function getMajorDropMode(trackT){
      // Hand-picked large transformations based on the analyzed song structure.
      const events=[
        {t:31,d:5,m:'burst'},
        {t:76,d:6,m:'tunnel'},
        {t:100,d:6,m:'invert'},
        {t:155,d:7,m:'burst'},
        {t:174,d:8,m:'prism'}
      ];
      for(const e of events){ if(trackT>=e.t && trackT<e.t+e.d) return {mode:e.m,p:(trackT-e.t)/e.d}; }
      return null;
    }

    function drawMajorDrop(drop,cue,beat,clock,phase,w,h){
      const p=drop.p;
      if(drop.mode==='burst'){
        glowCtx.globalCompositeOperation='screen';
        glowCtx.save(); glowCtx.translate(w/2,h/2);
        for(let i=0;i<26;i++){
          const a=(i/26)*Math.PI*2 + clock*.05;
          const len=Math.max(w,h)*(.18 + p*.75);
          glowCtx.strokeStyle=hsl(cue.a+i*9,100,62,.26+.45*(1-p));
          glowCtx.lineWidth=3+8*beat;
          glowCtx.beginPath(); glowCtx.moveTo(Math.cos(a)*20,Math.sin(a)*20); glowCtx.lineTo(Math.cos(a)*len,Math.sin(a)*len); glowCtx.stroke();
        }
        glowCtx.restore();
      } else if(drop.mode==='tunnel'){
        glowCtx.globalCompositeOperation='screen';
        for(let i=0;i<10;i++){
          const q=(i/10 + p*.9)%1;
          const rr=Math.min(w,h)*(0.06 + q*.72);
          glowCtx.strokeStyle=hsl(cue.b+i*14,100,64,.15+.55*(1-q));
          glowCtx.lineWidth=2+10*(1-q);
          glowCtx.beginPath(); glowCtx.arc(w/2,h/2,rr,0,Math.PI*2); glowCtx.stroke();
        }
      } else if(drop.mode==='invert'){
        glowCtx.globalCompositeOperation='difference';
        glowCtx.fillStyle=`rgba(255,255,255,${.45+.35*beat})`;
        glowCtx.fillRect(0,0,w,h);
      } else if(drop.mode==='prism'){
        glowCtx.globalCompositeOperation='screen';
        const bands=8;
        for(let i=0;i<bands;i++){
          const x=(i/bands)*w;
          const ww=w/bands+2;
          glowCtx.fillStyle=hsl(cue.a+i*38+clock*18,100,55,.18+.42*beat);
          glowCtx.fillRect(x,0,ww,h);
        }
      }
    }

    function drawGlow(nowMs){
      if(!glowActive) return;
      const w = window.innerWidth;
      const h = window.innerHeight;

      const inPreshow = preshowPlaying && audio.paused && scheduledAnchorMs != null && syncedNowMs() < scheduledAnchorMs;
      if(inPreshow){
        drawPreshowWind(nowMs, w, h);
        glowFrame=requestAnimationFrame(drawGlow);
        return;
      }

      const trackT = glowTrackTime();
      const cue = cueAt(trackT);
      const beatState = beatStateAt(trackT);
      const clock = nowMs / 1000;
      const phase = glowVariant * Math.PI * 2;
      const beat = beatState.pulse;
      const phraseHit = beatState.phraseHit;
      const transitionHit = sectionTransitionStrength(trackT);
      const breath = .5 + .5 * Math.sin(clock * .44 + phase);
      const energy = cue.e * (.88 + beat * .12);

      const hueA = glowPalette.a + cue.hueShift;
      const hueB = glowPalette.b + cue.hueShift * .55;
      const hueC = glowPalette.c - cue.hueShift * .30;

      drawLavaLamp(trackT, cue, beat, breath, clock, phase, energy, w, h);

      const majorDrop=getMajorDropMode(trackT);
      if(majorDrop){
        drawMajorDrop(majorDrop,cue,beat,clock,phase,w,h);
      }

      // Whole-screen pulse on every strong beat: subtle normally, emphatic during peaks.
      glowCtx.globalCompositeOperation='screen';
      glowCtx.fillStyle=hsl(cue.a+40,100,72,.025 + .07*beat*energy);
      glowCtx.fillRect(0,0,w,h);

      // White-out swell in the last six seconds of the 3:22 track.
      if(trackT >= 196 && trackT < 202){
        const finale = Math.min(1, (trackT-196)/6);
        glowCtx.globalCompositeOperation='screen';
        glowCtx.fillStyle=`rgba(255,255,255,${Math.sin(finale*Math.PI)*.30})`;
        glowCtx.fillRect(0,0,w,h);
      }

      glowFrame=requestAnimationFrame(drawGlow);
    }

    const PREFERRED_DRIFT_BAND_SEC = 0.35;
    const HARD_SEEK_TRIGGER_SEC = 0.42;

    const HARD_SEEK_COOLDOWN_MS = 8000;

    // lost while the playback pipeline settles. The real start then aims ahead
    // by that measured amount.
    const START_CALIBRATION_SAMPLE_MS = 1200;

    // canonical show target becomes stale before playback begins. After each

    const START_TARGET_STALE_SEC = 0.25;

    // This stays platform-agnostic and bounded.
    const STARTUP_SETTLING_RECOVERY_WINDOW_MS = 10000;
    const OBSERVED_RECOVERY_MAX_BIAS_SEC = 0.75;

    // v4.9 showed that outputLatency is useful as a

    // offset. Instead, let the actual media path establish itself, sample the
    // settled startup plateau, and correct that observed offset exactly once.
    //
    // Samples begin at 1 s because the first ~500 ms can be a moving transition.
    // While this observation is active, the generic sustained-drift controller
    // stands down so it cannot race the one-shot startup correction.
    const STARTUP_OBSERVATION_DELAYS_MS = [1000, 1500, 2000];
    const STARTUP_OBSERVATION_MAX_SPREAD_SEC = 0.06;
    const STARTUP_OBSERVATION_MIN_BIAS_SEC = 0.08;

    const STARTUP_OBSERVED_CORRECTION_FACTOR = 1.00;
    const POST_SEEK_SETTLING_GRACE_MS = 1500;

    const INTERRUPTION_RECOVERY_DELAY_MS = 1800;

      }

      return highResNowMs() + serverClockOffsetMs;
    }

    function freezePerformanceClock(){
      if(performanceClockFrozen) return;

      frozenPerformanceNowMs = performance.now();

    }

    function unfreezePerformanceClock(){

    function finishTimingOperation(op){

    function timingSummary(label, op){
      if(!op) return `${label}: —`;

      const calcToSeek = msBetween(op.calculatedAtMs, op.seekAssignedAtMs);
      const seekWait = msBetween(op.seekAssignedAtMs, op.seekedAtMs);
      const seekToPlay = msBetween(op.seekedAtMs, op.playCalledAtMs);
      const playPromise = msBetween(op.playCalledAtMs, op.playResolvedAtMs);
      const calcToPlaying = msBetween(op.calculatedAtMs, op.playingEventAtMs);
      const residualMs = op.residualAtPlayingSec == null ? null : Math.round(op.residualAtPlayingSec * 1000);

      const s = op.settlingSamplesMs || {};
      const settlingText =
        `0 ${fmtMs(residualMs)} · 100 ${fmtMs(s[100])} · 250 ${fmtMs(s[250])} · ` +
        `500 ${fmtMs(s[500])} · 1s ${fmtMs(s[1000])} · 2s ${fmtMs(s[2000])} · ` +
        `3s ${fmtMs(s[3000])} · 5s ${fmtMs(s[5000])}`;

      const retargetText = op.kind === "start"
        ? ` · retargets ${op.startupRetargetCount || 0} · max target age ${fmtMs(op.startupMaxTargetAgeMs || 0)}`
        : "";

      return `${label}: calc→seek ${fmtMs(calcToSeek)} · seek ${fmtMs(seekWait)} · seek→play ${fmtMs(seekToPlay)} · play promise ${fmtMs(playPromise)} · calc→playing ${fmtMs(calcToPlaying)}${retargetText}<br>` +
        `${label} settling: ${settlingText}`;

    function scheduleSettlingSamples(op){
      if(!op || op.playingEventAtMs == null) return;

      const delays = [100, 250, 500, 1000, 2000, 3000, 5000];

      for(const delay of delays){
        setTimeout(()=>{
          if(audio.ended) return;
          const driftMs = Math.round(getCurrentDriftSec() * 1000);
          op.settlingSamplesMs[delay] = driftMs;

        }, delay);
      }
    }

    function calibrationProbeSummary(){
      const outputText = outputLatencySupported
        ? `${Math.round(outputLatencySec * 1000)} ms`
        : "unavailable";

      if(!startupCalibrationMeasured){
        return `Output latency: ${outputText}<br>Pre-curtain calibration: —`;
      }

      const pipelineLossMs = Math.round(startupPipelineLossSec * 1000);
      const biasMs = Math.round(startupCalibrationBiasSec * 1000);
      const passText = startupCalibrationPasses.length
        ? startupCalibrationPasses.map((p, i)=>`pass ${i + 1}: real ${fmtMs(p.realMs)} · media ${fmtMs(p.mediaMs)} · loss ${Math.round(p.lossSec * 1000)} ms`).join("<br>")
        : "passes —";

    function clampLatencySec(value){

    function refreshOutputLatencyEstimate(){

          outputLatencySec = clampLatencySec(candidate);
          outputLatencySupported = true;
        }
      }catch(err){
        // Keep the last good estimate. Output-latency support is optional.
      }

      return outputLatencySec;
    }

          await outputLatencyContext.resume();

        // Give the context a moment to bind to the currently selected output.

        refreshOutputLatencyEstimate();
        updateTimingProbe();
        return outputLatencySupported;

    function formatCountdown(ms){
      const s = Math.max(0, Math.ceil(ms / 1000));
      const m = Math.floor(s / 60);
      const sec = s % 60;

      return `${m}:${String(sec).padStart(2, "0")}`;
    }

    function formatClockTime(sec){
      sec = Math.max(0, sec || 0);

      const whole = Math.floor(sec);
      const m = Math.floor(whole / 60);
      const s = whole % 60;

      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function updateTransport(){
      const current = audio.currentTime || 0;
      const duration = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 0;

    function formatSignedMs(sec){
      if(sec == null) return "—";

    function formatElapsedSince(ms){
      if(ms == null) return "—";
      const totalSec = Math.max(0, Math.floor((highResNowMs() - ms) / 1000));

    function recordDriftSample(driftSec){
      if(!isFinite(driftSec)) return;

      if(initialDriftSec == null){
        initialDriftSec = driftSec;
      }

      const absDrift = Math.abs(driftSec);
      driftSampleCount += 1;
      driftAbsSumSec += absDrift;
      bestAbsDriftSec = bestAbsDriftSec == null ? absDrift : Math.min(bestAbsDriftSec, absDrift);
      worstAbsDriftSec = worstAbsDriftSec == null ? absDrift : Math.max(worstAbsDriftSec, absDrift);

      if(absDrift < 0.15) samplesUnder150 += 1;
      if(absDrift < 0.25) samplesUnder250 += 1;
      if(absDrift < PREFERRED_DRIFT_BAND_SEC){
        samplesUnderThreshold += 1;
      }else{
        samplesAtOrAboveThreshold += 1;
      }
    }

    function updateDriftStats(){
      const avgAbsSec = driftSampleCount > 0 ? driftAbsSumSec / driftSampleCount : null;
      const improvementSec = initialDriftSec == null ? null : Math.abs(initialDriftSec) - Math.abs(lastDriftSec);
      const improvementText = improvementSec == null ? "—" : `${Math.round(improvementSec * 1000)} ms`;
      const pct = count => driftSampleCount > 0 ? `${Math.round((count / driftSampleCount) * 100)}%` : "—";

      let lastSeekText = "—";
      if(lastSeekBeforeSec != null && lastSeekAfterSec != null){
        lastSeekText = `${formatSignedMs(lastSeekBeforeSec)} → ${formatSignedMs(lastSeekAfterSec)} · ${formatElapsedSince(lastSuccessfulHardSeekAtMs)}`;
