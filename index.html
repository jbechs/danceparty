<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="theme-color" content="#050208">
  <meta name="color-scheme" content="dark">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#120b18" />
  <title>dance party now</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root{ color-scheme: dark; }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#120b18;
      color:#fff;
      font-family:'Inter', system-ui, sans-serif;
    }

    .container{
      width:min(90vw,420px);
      display:grid;
      gap:16px;
      text-align:center;
    }

    .header{
      display:grid;
      gap:6px;
      margin-bottom:28px;
    }

    h1{
      margin:0;
      font-size:1.8rem;
      letter-spacing:.04em;
      font-weight:600;
    }

    .subtitle{
      font-size:.9rem;
      color:#aaa;
    }

    label{
      font-size:.95rem;
    }

    input, button{
      font-size:1rem;
      padding:12px;
      border-radius:8px;
      border:none;
    }

    input{
      background:#241034;
      color:#fff;
    }

    button{
      background:#fff;
      color:#111;
      font-weight:600;
      cursor:pointer;
      min-width:140px;
      justify-self:center;
    }

    button:disabled{
      cursor:default;
    }

    .startNow{
      font-size:1.15rem;
      padding:16px;
    }

    .status{
      min-height:1.4em;
      color:#bbb;
    }

    .countdown{
      min-height:1.4em;
      font-size:1.2rem;
      font-weight:600;
    }

    .transport{
      min-height:1.4em;
      font-size:1rem;
      color:#fff;
      font-variant-numeric:tabular-nums;
    }

    .debug{
      font-size:.82rem;
      color:#777;
      min-height:1.2em;
      word-break:break-word;
    }

    .diagnosticsToggle{
      width:auto;
      min-width:44px;
      min-height:30px;
      padding:4px 8px;
      border:0;
      border-radius:6px;
      background:transparent;
      color:rgba(255,255,255,.10);
      font-size:.56rem;
      font-weight:400;
      letter-spacing:.03em;
      justify-self:end;
      opacity:.38;
      box-shadow:none;
    }

    .diagnosticsToggle:hover,
    .diagnosticsToggle:focus-visible{
      color:rgba(255,255,255,.34);
      opacity:.8;
      background:rgba(255,255,255,.025);
    }

    .diagnosticsPanel{
      display:grid;
      gap:6px;
    }

    .timingProbe{
      font-size:.76rem;
      color:#666;
      line-height:1.4;
      word-break:break-word;
    }

    .diagnosticsPanel.hidden{
      display:none;
    }

    .hidden{
      display:none;
    }

    audio{
      width:100%;
    }

    input[type="datetime-local"]{
      color:#fff;
      background:#241034;
    }

    input[type="datetime-local"]::-webkit-calendar-picker-indicator{
      filter:invert(1);
    }


    /* COMMON GLOW variation: full-screen luminous crowd object.
       Presentation-only layer: playback/sync logic remains unchanged. */
    #glowScreen{
      position:fixed;
      inset:0;
      z-index:1000;
      overflow:hidden;
      background:#160824;
      opacity:0;
      visibility:hidden;
      transition:opacity 700ms ease;
      touch-action:manipulation;
      user-select:none;
      -webkit-user-select:none;
    }

    #glowScreen.active{
      opacity:1;
      visibility:visible;
    }

    #glowCanvas{
      width:100%;
      height:100%;
      display:block;
      filter:saturate(1.18) contrast(1.05);
    }

    #glowVignette{
      position:absolute;
      inset:0;
      pointer-events:none;
      background:radial-gradient(circle at 50% 47%, transparent 0 30%, rgba(0,0,0,.10) 58%, rgba(0,0,0,.48) 100%);
      mix-blend-mode:multiply;
    }

    #glowCountdown{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      z-index:3;
      margin:0;
      padding:0;
      border:0;
      background:none;
      box-shadow:none;
      text-align:center;
      font-family:Arial, Helvetica, sans-serif;
      font-size:clamp(4rem,18vw,8rem);
      font-weight:400;
      line-height:1;
      letter-spacing:0;
      color:#fff;
      font-variant-numeric:tabular-nums;
      text-shadow:none;
      pointer-events:none;
      opacity:1;
      transition:opacity 5s linear;
    }

    #glowCountdown.fadeZero{
      opacity:0;
    }

    #fullscreenButton{
      position:absolute;
      left:50%;
      bottom:max(8vh,32px);
      transform:translateX(-50%);
      z-index:4;
      width:min(72vw,280px);
      padding:15px 18px;
      border:1px solid rgba(255,255,255,.34);
      border-radius:999px;
      color:white;
      background:rgba(20,8,30,.50);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      box-shadow:0 0 28px rgba(180,120,255,.10);
      text-transform:none;
    }

    #fullscreenButton.hidden{ display:none; }

    #glowResume{
      position:absolute;
      left:50%;
      bottom:max(8vh,32px);
      transform:translateX(-50%);
      z-index:2;
      width:min(78vw,320px);
      padding:15px 18px;
      border:1px solid rgba(255,255,255,.42);
      border-radius:999px;
      color:white;
      background:rgba(0,0,0,.42);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      box-shadow:0 0 30px rgba(255,255,255,.12);
    }

    #glowResume.hidden{ display:none; }

  
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100%;
      min-height: 100%;
      background: #050208 !important;
      color-scheme: dark;
      overscroll-behavior: none;
    }

    html {
      min-height: 100%;
      background-color: #050208 !important;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background-color: #050208 !important;
    }

    /* Keep the browser's exposed/overscroll canvas from flashing white. */
    :root {
      background: #050208 !important;
    }

    #glowScreen,
    #glowCanvas {
      background: #050208 !important;
    }

    /* Fullscreen element must itself paint the entire viewport. */
    :fullscreen,
    :-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      background: #050208 !important;
    }

    :fullscreen #glowScreen,
    :-webkit-full-screen #glowScreen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      min-height: 100vh !important;
      min-height: 100dvh !important;
      background: #050208 !important;
    }

</style>
</head>

<body>

  <div id="glowScreen" aria-hidden="true">
    <canvas id="glowCanvas"></canvas>
    <div id="glowVignette"></div>
    <div id="glowCountdown" aria-live="polite"></div>
    <button id="fullscreenButton" type="button">go fullscreen</button>
    <button id="glowResume" class="hidden" type="button">Tap to resume sound</button>
  </div>

  <main class="container">
    <div class="header">
      <h1>dance party now</h1>
      <div class="subtitle">crank all devices & turn off lights</div>
    </div>

    <label for="startTime">Start Time</label>
    <input id="startTime" type="datetime-local" step="60" />

    <button id="playButton">Begin</button>
    <button id="startNowButton" class="startNow hidden">Begin</button>

    <div id="countdown" class="countdown"></div>
    <div id="status" class="status">Ready.</div>
    <div id="transport" class="transport">00:00 / 00:00 · drift 0 ms</div>
    <button id="diagnosticsToggle" class="diagnosticsToggle" type="button" aria-expanded="false">info</button>
    <div id="diagnosticsPanel" class="diagnosticsPanel hidden">
      <div id="driftStats" class="debug">Initial — · Avg — · Best — · Worst —<br>Hard seeks 0 · Last —</div>
      <div id="timingProbe" class="timingProbe">Timing probe — waiting for playback</div>
      <div id="debug" class="debug"></div>
    </div>

    <audio id="audio" preload="auto" playsinline class="hidden"></audio>
    <audio id="preshowAudio" preload="auto" playsinline loop class="hidden"></audio>
  </main>

  <script> 
    const AUDIO_URL = "https://eggtooth.xyz/Life.mp3";
    const PRESHOW_AUDIO_URL = "https://eggtooth.xyz/quietWind.mp3";
    const TIME_SERVER_URL = "https://sync1.jbechs.workers.dev/";

    const audio = document.getElementById("audio");
    const preshowAudio = document.getElementById("preshowAudio");
    const playButton = document.getElementById("playButton");
    const startNowButton = document.getElementById("startNowButton");
    const startInput = document.getElementById("startTime");

    // On each fresh load, default the curtain to the first whole-minute boundary
    // that is strictly more than 60 seconds away.
    // Example: 8:42:15 -> 8:44:00; 8:42:00 -> 8:44:00.
    function setDefaultStartTime(){
      const nowMs = Date.now();
      const targetMs = Math.ceil((nowMs + 60001) / 60000) * 60000;
      const d = new Date(targetMs);
      const pad = n => String(n).padStart(2, "0");
      startInput.value =
        `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` +
        `T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    const statusEl = document.getElementById("status");
    const countdownEl = document.getElementById("countdown");
    const glowCountdownEl = document.getElementById("glowCountdown");
    const diagnosticsToggle = document.getElementById("diagnosticsToggle");
    const diagnosticsPanel = document.getElementById("diagnosticsPanel");
    const transportEl = document.getElementById("transport");
    const driftStatsEl = document.getElementById("driftStats");
    const timingProbeEl = document.getElementById("timingProbe");
    const debugEl = document.getElementById("debug");

    // --- COMMON GLOW presentation layer ---------------------------------
    // A local canvas animation that turns every participant phone into a
    // luminous object. It never drives audio or modifies the show clock.
    const glowScreen = document.getElementById("glowScreen");
    const glowCanvas = document.getElementById("glowCanvas");
    const glowCtx = glowCanvas.getContext("2d", { alpha:false });
    const fullscreenButton = document.getElementById("fullscreenButton");
    const glowResume = document.getElementById("glowResume");
    let glowActive = false;
    let glowPerformanceStarted = false;
    let glowFrame = null;
    let glowTapTimes = [];

    // A tiny per-device phase difference keeps a crowd visually alive while
    // cue changes remain synchronized. Session-scoped; no storage or identity.
    const glowVariant = Math.random();
    // Each participant enters through one of three equally likely color families.
    // The show cues remain synchronized; only the palette family differs.
    const glowPaletteIndex = Math.floor(Math.random() * 3);
    const GLOW_PALETTE_OFFSETS = [0, 118, 236];
    const glowPaletteOffset = GLOW_PALETTE_OFFSETS[glowPaletteIndex];

    // The visual score is locked to the same canonical show clock as playback.
    // Beat grid measured from Life.mp3 (123.046875 BPM; first beat transient ~0.04644s).
    const GLOW_BPM = 123.046875;
    const GLOW_BEAT0 = 0.04644;
    const GLOW_SEC_PER_BEAT = 60 / GLOW_BPM;

    // Structural cue points measured from the supplied Life.mp3. These are not
    // live audio detections: every handset evaluates the same score from track time.
    const GLOW_CUES = [
      // time, hue A, hue B, base energy, motion multiplier
      // Keep the opening beautiful and controlled; each return of the beat earns more power.
      { t:0.000,   a:195, b:315, e:.52, m:.56 },
      { t:23.522,  a:214, b:326, e:.60, m:.66 },
      { t:36.827,  a:325, b:24,  e:.78, m:.92 }, // first lift
      { t:48.437,  a:92,  b:205, e:.88, m:1.08 },
      { t:56.000,  a:272, b:332, e:.43, m:.54 }, // withdrawal
      { t:69.730,  a:328, b:28,  e:.98, m:1.24 }, // first release
      { t:81.583,  a:272, b:332, e:.60, m:.74 }, // interruption / suspension
      { t:98.754,  a:18,  b:350, e:1.12, m:1.42 }, // second hit
      { t:113.650, a:258, b:318, e:.46, m:.58 }, // long suspension
      { t:151.986, a:184, b:226, e:.82, m:1.08 }, // ascent begins
      { t:158.000, a:212, b:282, e:.94, m:1.24 },
      { t:163.596, a:292, b:42,  e:1.14, m:1.52 }, // pressure before major drop
      { t:169.900, a:300, b:70,  e:1.58, m:2.08 }, // BIG DROP
      { t:180.291, a:34,  b:196, e:1.72, m:2.30 }, // full power
      { t:193.840, a:316, b:86,  e:1.90, m:2.56 }, // final drive
      { t:200.980, a:205, b:330, e:1.44, m:1.72 }, // final bloom
      { t:202.600, a:250, b:300, e:.24, m:.32 }
    ];

    const GLOW_DROP_EVENTS = [
      { t:36.827,  s:.40 },
      { t:48.437,  s:.34 },
      { t:69.730,  s:.72 },
      { t:81.583,  s:.34 },
      { t:98.754,  s:.82 },
      { t:151.986, s:.38 },
      { t:163.596, s:.58 },
      { t:169.900, s:1.34 },
      { t:180.291, s:.88 },
      { t:193.840, s:1.00 },
      { t:200.980, s:.90 }
    ];

    // Percussive passages get a distinct boost: the same organism becomes more
    // physical rather than introducing a new graphic vocabulary.
    const GLOW_PERCUSSIVE_SECTIONS = [
      { start:36.827, end:55.900, s:.20 },
      { start:69.730, end:81.450, s:.38 },
      { start:98.754, end:113.500, s:.48 },
      { start:163.596,end:169.860, s:.34 },
      { start:169.900,end:200.900, s:.82 }
    ];

    function resizeGlow(){
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const vv = window.visualViewport;
      const w = Math.max(1, vv ? vv.width : window.innerWidth);
      const h = Math.max(1, vv ? vv.height : window.innerHeight);
      glowCanvas.width = Math.round(w * dpr);
      glowCanvas.height = Math.round(h * dpr);
      glowCanvas.style.width = `${w}px`;
      glowCanvas.style.height = `${h}px`;
      glowCtx.setTransform(dpr,0,0,dpr,0,0);
    }

    // Best-effort presentation enhancements, invoked only from the audience's
    // explicit "go fullscreen" tap. Unsupported browsers simply continue normally.
    let wakeLockSentinel = null;

    async function requestGlowWakeLock(){
      try{
        if("wakeLock" in navigator && document.visibilityState === "visible"){
          if(wakeLockSentinel && !wakeLockSentinel.released) return;
          wakeLockSentinel = await navigator.wakeLock.request("screen");
          wakeLockSentinel.addEventListener("release", ()=>{ wakeLockSentinel = null; });
        }
      }catch(_err){
        // Wake lock is optional; never interfere with playback.
      }
    }

    async function requestGlowFullscreen(){
      let entered = false;

      // Paint all potentially exposed browser/document areas dark before requesting
      // fullscreen, so unsupported/mobile browsers do not reveal a bright page edge.
      document.documentElement.style.backgroundColor = "#050208";
      document.body.style.backgroundColor = "#050208";
      glowScreen.style.backgroundColor = "#050208";

      try{
        // Fullscreen the visual surface itself rather than the entire document.
        // On browsers that support the modern API, ask to hide navigation UI.
        const el = glowScreen;
        if(typeof el.requestFullscreen === "function"){
          try{
            await el.requestFullscreen({ navigationUI: "hide" });
          }catch(_optsErr){
            const result = el.requestFullscreen();
            if(result && typeof result.then === "function") await result;
          }
          entered = true;
        }else{
          const webkitRequest =
            el.webkitRequestFullscreen ||
            el.webkitRequestFullScreen;
          if(typeof webkitRequest === "function"){
            const result = webkitRequest.call(el);
            if(result && typeof result.then === "function") await result;
            entered = true;
          }else if(typeof document.documentElement.webkitRequestFullscreen === "function"){
            const result = document.documentElement.webkitRequestFullscreen();
            if(result && typeof result.then === "function") await result;
            entered = true;
          }
        }
      }catch(_err){
        // iPhone Safari may refuse arbitrary-element fullscreen. Keep the visual
        // pinned edge-to-edge and dark; playback must never depend on fullscreen.
      }

      // Best available immersive viewport even when true fullscreen is unavailable.
      glowScreen.style.position = "fixed";
      glowScreen.style.inset = "0";
      glowScreen.style.width = "100vw";
      glowScreen.style.height = "100dvh";
      glowScreen.style.minHeight = "100vh";

      // On mobile browsers this encourages collapse of URL/tool bars after the tap.
      try{
        window.scrollTo({ top: 1, left: 0, behavior: "instant" });
      }catch(_err){
        window.scrollTo(0, 1);
      }

      requestGlowWakeLock();
      return entered;
    }

    function glowTrackTime(){
      // Canonical show time is the visual source of truth. This is what keeps
      // beat drops aligned to the shared UTC performance clock on every device.
      // audio.currentTime is only a fallback when the shared clock is unavailable.
      if(glowPerformanceStarted && scheduledAnchorMs != null && performanceClockFrozen){
        const expected = getExpectedTrackTimeSec();
        if(expected != null && expected >= 0){
          const maxT = (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : 202.65;
          return Math.min(expected, maxT);
        }
      }
      if(!audio.paused && isFinite(audio.currentTime)) return audio.currentTime;
      return 0;
    }

    function cueAt(t){
      let c = GLOW_CUES[0];
      for(let i=1;i<GLOW_CUES.length;i++){
        if(t < GLOW_CUES[i].t) break;
        c = GLOW_CUES[i];
      }
      return c;
    }

    function cueBlendAt(t){
      let i=0;
      while(i < GLOW_CUES.length-1 && t >= GLOW_CUES[i+1].t) i++;
      const a=GLOW_CUES[i];
      const b=GLOW_CUES[Math.min(i+1,GLOW_CUES.length-1)];
      if(a===b) return {...a};
      const span=Math.max(.001,b.t-a.t);
      let x=Math.max(0,Math.min(1,(t-a.t)/span));
      // Keep drops crisp while allowing the organism to evolve between them.
      x=x*x*(3-2*x);
      return {
        t,
        a:a.a+(b.a-a.a)*x,
        b:a.b+(b.b-a.b)*x,
        e:a.e+(b.e-a.e)*x,
        m:a.m+(b.m-a.m)*x
      };
    }

    function beatEnvelope(t){
      if(t < GLOW_BEAT0) return 0;
      const beatPos=(t-GLOW_BEAT0)/GLOW_SEC_PER_BEAT;
      const frac=beatPos-Math.floor(beatPos);
      return Math.exp(-frac*7.2);
    }

    function barEnvelope(t){
      if(t < GLOW_BEAT0) return 0;
      const beatIndex=Math.floor((t-GLOW_BEAT0)/GLOW_SEC_PER_BEAT);
      return (beatIndex % 4 === 0) ? beatEnvelope(t) : 0;
    }

    function dropEnvelope(t){
      let sum=0;
      for(const ev of GLOW_DROP_EVENTS){
        const dt=t-ev.t;
        if(dt>=0 && dt<1.45) sum += ev.s*Math.exp(-dt*3.8);
      }
      return Math.min(1.45,sum);
    }

    function percussiveDrive(t){
      let d=0;
      for(const s of GLOW_PERCUSSIVE_SECTIONS){
        if(t>=s.start && t<s.end) d=Math.max(d,s.s);
      }
      return d;
    }

    function flashEnvelope(t){
      // Very short, colored flashes only on scored impacts. Back-half flashes are
      // deliberately more forceful, but never use linework or filament graphics.
      let sum=0;
      for(const ev of GLOW_DROP_EVENTS){
        const dt=t-ev.t;
        if(dt>=0 && dt<.34){
          const backHalf = ev.t >= 151.986 ? 1.45 : 1.0;
          sum += ev.s*backHalf*Math.exp(-dt*12.5);
        }
      }
      return Math.min(2.1,sum);
    }

    function hsl(h,s,l,a=1){
      return `hsla(${((h%360)+360)%360} ${s}% ${l}% / ${a})`;
    }

    function drawGlow(nowMs){
      if(!glowActive) return;
      const vv = window.visualViewport;
      const w = vv ? vv.width : window.innerWidth;
      const h = vv ? vv.height : window.innerHeight;
      const trackT = glowTrackTime();
      const cue = cueBlendAt(trackT);
      // Once the performance begins, animation time itself comes from trackT.
      // requestAnimationFrame only redraws; it no longer defines musical phase.
      const clock = glowPerformanceStarted ? trackT : nowMs / 1000;
      const phase = glowVariant * Math.PI * 2;
      const beatKick = beatEnvelope(trackT);
      const barKick = barEnvelope(trackT);
      const dropKick = dropEnvelope(trackT);
      const percDrive = percussiveDrive(trackT);
      const flashKick = flashEnvelope(trackT);
      const backHalf = Math.max(0, Math.min(1, (trackT-113.650)/(169.900-113.650)));
      const breath = .5 + .5 * Math.sin(clock * .52 + phase);
      const pulse = Math.min(2.2, .15 + (.62+.38*percDrive)*beatKick + (.24+.34*percDrive)*barKick + .82*dropKick);
      const energy = cue.e * (.68 + .14*breath + (.22+.26*percDrive)*beatKick + (.16+.26*percDrive)*barKick + .72*dropKick);

      glowCtx.globalCompositeOperation = 'source-over';
      // Deep-purple luminous field beneath every state.
      glowCtx.fillStyle = '#160824';
      glowCtx.fillRect(0,0,w,h);

      // PRESHOW: alive, but deliberately restrained. The handset should already
      // feel luminous in the room without spending the visual payoff before cue 0.
      if(!glowPerformanceStarted){
        const preshowBreath = .5 + .5 * Math.sin(clock * .34 + phase);
        const preshowBodies = [
          { hue:285, x:.46 + .07*Math.sin(clock*(.12*cue.m) + phase),     y:.46 + .06*Math.cos(clock*.10 + phase*.7), r:.62, a:.16 },
          { hue:330, x:.60 + .06*Math.cos(clock*(.09*cue.m) + phase*1.3), y:.57 + .05*Math.sin(clock*(.27*cue.m) + phase*.5), r:.48, a:.10 }
        ];
        glowCtx.globalCompositeOperation='screen';
        for(const b of preshowBodies){
          const x=b.x*w, y=b.y*h, r=b.r*Math.max(w,h)*( .98 + .04*preshowBreath );
          const g=glowCtx.createRadialGradient(x,y,0,x,y,r);
          g.addColorStop(0, hsl(b.hue, 88, 58, b.a*(.82+.18*preshowBreath)));
          g.addColorStop(.42, hsl(b.hue+24, 82, 44, b.a*.46));
          g.addColorStop(1, hsl(b.hue, 80, 30, 0));
          glowCtx.fillStyle=g;
          glowCtx.fillRect(x-r,y-r,r*2,r*2);
        }
        glowFrame=requestAnimationFrame(drawGlow);
        return;
      }

      // SHOW: fractal metamorphosis field — INTENSE BUILD edition.
      // No strokes, filaments, outlines, or line graphics. Every visible form is temporary:
      // it folds, buds, splits, erodes, and becomes another form.
      const baseHueA = cue.a + glowPaletteOffset;
      const baseHueB = cue.b + glowPaletteOffset;
      const minDim = Math.min(w,h);

      glowCtx.globalCompositeOperation='source-over';
      glowCtx.fillStyle='#000';
      glowCtx.fillRect(0,0,w,h);

      const pulseA=Math.min(2.35,.14 + (.70+.48*percDrive)*beatKick + (.30+.42*percDrive)*barKick + .88*dropKick);
      const pulseB=.5+.5*Math.sin(clock*(.68*cue.m)+phase*.47);
      const pressure=.88 + .07*pulseB + .13*pulseA + .18*dropKick + .07*backHalf;

      // Recursive morph fields: broad soft masks that continually change topology.
      // Each field is built from layered deformed lobes, not fixed primitives.
      glowCtx.globalCompositeOperation='screen';

      const morphs = [
        {h:baseHueA,     x:.30,y:.38,s:.66,o:.3},
        {h:baseHueB+80,  x:.68,y:.58,s:.72,o:1.9},
        {h:baseHueA+165, x:.50,y:.50,s:.82,o:3.6}
      ];

      for(let mi=0;mi<morphs.length;mi++){
        const m=morphs[mi];

        const cx=w*(m.x
          + .18*Math.sin(clock*((.21+.025*mi)*cue.m)+m.o+phase)
          + .07*Math.sin(clock*((.53+.017*mi)*cue.m)+m.o*.7));
        const cy=h*(m.y
          + .16*Math.cos(clock*((.19+.021*mi)*cue.m)+m.o*.8+phase*.6)
          + .065*Math.sin(clock*((.47+.014*mi)*cue.m)+m.o*.5));

        const baseR=minDim*m.s*pressure*
          (1+.14*Math.sin(clock*((.69+.03*mi)*cue.m)+m.o)+.06*Math.sin(clock*((1.31+.02*mi)*cue.m)+phase));

        // Build several translucent child forms whose frequencies drift over time.
        // As frequencies cross, one blob appears to become another.
        const layerCount = cue.e > 1.70 ? 13 : (cue.e > 1.35 ? 11 : (cue.e > 1.00 ? 9 : 6));
        for(let layer=0;layer<layerCount;layer++){
          const t=layer/Math.max(1,layerCount-1);
          const f2=1.3 + .7*(.5+.5*Math.sin(clock*(.17*cue.m)+mi+layer*.6));
          const f3=2.2 + .9*(.5+.5*Math.sin(clock*(.13*cue.m)+phase+layer*.8));
          const f5=3.8 + 1.1*(.5+.5*Math.sin(clock*(.09*cue.m)+mi*.7+layer));
          const localR=baseR*(.34+t*.16);

          glowCtx.save();
          glowCtx.translate(cx,cy);
          glowCtx.rotate(.22*Math.sin(clock*((.23+.013*layer)*cue.m)+m.o+layer));

          glowCtx.beginPath();
          const steps=128;
          for(let j=0;j<=steps;j++){
            const a=j/steps*Math.PI*2;

            // Drifting harmonics create recursive, always-changing organic topology.
            const d=
              1
              + .24*Math.sin(f2*a + clock*((.59+.025*layer)*cue.m)+phase+mi)
              + .15*Math.sin(f3*a - clock*((.43+.018*layer)*cue.m)+layer*.9)
              + .09*Math.sin(f5*a + clock*((.31+.014*layer)*cue.m)+m.o)
              + .045*Math.sin((f2+f3)*a - clock*(.22*cue.m) + layer);

            const shear=.16*Math.sin(clock*(.27*cue.m)+layer+mi);
            const px=Math.cos(a)*localR*d + Math.sin(a)*localR*shear;
            const py=Math.sin(a)*localR*d*(.70+.18*Math.sin(clock*(.16*cue.m)+layer))
              + Math.cos(a*2+clock*(.24*cue.m))*localR*.07;

            if(j===0) glowCtx.moveTo(px,py); else glowCtx.lineTo(px,py);
          }
          glowCtx.closePath();

          const hue=m.h + 110*t + 42*Math.sin(clock*.15+layer+mi);
          glowCtx.fillStyle=hsl(hue,100,Math.min(82,54+10*pulseA+8*backHalf),.034+.040*(1-t)+.010*percDrive);
          glowCtx.shadowBlur=minDim*(.07+.04*(1-t));
          glowCtx.shadowColor=hsl(hue+30,100,62,.34);
          glowCtx.fill();

          glowCtx.restore();
        }
      }

      // Recursive erosion: black soft forms continuously remove pieces from the color,
      // forcing the visible topology to mutate rather than merely swell.
      glowCtx.globalCompositeOperation='destination-out';
      for(let i=0;i<5;i++){
        const ex=w*(.5+.38*Math.sin(clock*((.20+.016*i)*cue.m)+phase+i*1.3));
        const ey=h*(.5+.34*Math.cos(clock*((.18+.014*i)*cue.m)+phase*.7+i*.9));
        const er=minDim*(.12+.10*(.5+.5*Math.sin(clock*((.41+.019*i)*cue.m)+i)));
        const eg=glowCtx.createRadialGradient(ex,ey,0,ex,ey,er*2.9);
        eg.addColorStop(0,'rgba(0,0,0,.82)');
        eg.addColorStop(.38,'rgba(0,0,0,.56)');
        eg.addColorStop(.74,'rgba(0,0,0,.16)');
        eg.addColorStop(1,'rgba(0,0,0,0)');
        glowCtx.fillStyle=eg;
        glowCtx.fillRect(ex-er*3,ey-er*3,er*6,er*6);
      }

      // Soft luminous buds replace all filament/line vocabulary. Each bud is a
      // blurred volumetric glow with no stroke, outline, arc, or connecting trace.
      glowCtx.globalCompositeOperation='screen';
      const budCount = cue.e > 1.70 ? 30 : (cue.e > 1.35 ? 24 : (cue.e > 1.00 ? 17 : 9));
      for(let bud=0;bud<budCount;bud++){
        const u=(bud+.5)/budCount;
        const a=bud*2.399963229728653 + phase*.35 + .42*Math.sin(clock*(.16*cue.m)+bud*.73);
        const orbit=minDim*(.08 + u*.46)*(1+.10*Math.sin(clock*(.31*cue.m)+bud));
        const bx=w/2 + Math.cos(a)*orbit + Math.sin(clock*(.22*cue.m)+bud)*minDim*.045;
        const by=h/2 + Math.sin(a)*orbit*.74 + Math.cos(clock*(.19*cue.m)+bud*.6)*minDim*.040;
        const br=minDim*(.030 + .040*(.5+.5*Math.sin(clock*(.39*cue.m)+bud*1.17)))
          *(1+.44*pulseA+.40*dropKick+.10*backHalf);
        const hue=baseHueA+bud*31+42*Math.sin(clock*(.11*cue.m)+bud);
        const bg=glowCtx.createRadialGradient(bx,by,0,bx,by,br*3.2);
        bg.addColorStop(0,hsl(hue+24,100,Math.min(88,68+8*backHalf+6*flashKick),.10+.13*pulseA+.15*dropKick+.04*percDrive));
        bg.addColorStop(.26,hsl(hue,100,Math.min(72,57+8*backHalf),.075+.065*pulseB+.025*percDrive));
        bg.addColorStop(.62,hsl(hue+72,98,Math.min(62,47+7*backHalf),.028+.032*pulseA));
        bg.addColorStop(1,hsl(hue,96,38,0));
        glowCtx.fillStyle=bg;
        glowCtx.fillRect(bx-br*3.2,by-br*3.2,br*6.4,br*6.4);
      }

      // Global metamorphic surge: whole field swells in chroma and scale pressure,
      // but never flashes white or resolves into a fixed shape.
      const surge=Math.pow(.5+.5*Math.sin(clock*(.81*cue.m)+phase*.23),2.0);
      const sx=w*(.5+.20*Math.sin(clock*(.25*cue.m)+phase));
      const sy=h*(.5+.18*Math.cos(clock*(.21*cue.m)+phase*.8));
      const sr=minDim*(.44+.20*surge+.10*backHalf+.09*dropKick);
      const sg=glowCtx.createRadialGradient(sx,sy,0,sx,sy,sr);
      sg.addColorStop(0,hsl(baseHueA+35,100,Math.min(90,70+12*backHalf),.04+.10*surge+.05*backHalf));
      sg.addColorStop(.38,hsl(baseHueB+75,100,Math.min(74,56+10*backHalf),.03+.075*surge+.035*backHalf));
      sg.addColorStop(.72,hsl(baseHueA+150,100,Math.min(62,46+9*backHalf),.015+.038*surge));
      sg.addColorStop(1,hsl(baseHueA,100,38,0));
      glowCtx.fillStyle=sg;
      glowCtx.fillRect(sx-sr,sy-sr,sr*2,sr*2);

      // Percussive isolation: in the beat-heavy passages, each kick briefly compresses
      // the image into a brighter colored bloom. The back half gets markedly hotter.
      if(percDrive > 0 && beatKick > .08){
        const beatAlpha=Math.min(.24, (.018+.075*percDrive)*beatKick*(1+.65*backHalf));
        glowCtx.globalCompositeOperation='screen';
        glowCtx.fillStyle=hsl(baseHueA+28,100,Math.min(82,60+16*backHalf),beatAlpha);
        glowCtx.fillRect(0,0,w,h);
      }

      // Scored drop flashes. These are full-field color/light events, not white linework.
      if(flashKick > .01 || dropKick > .012 || barKick > .12){
        const impactAlpha=Math.min(.62,
          .018*barKick +
          (.16+.12*backHalf)*dropKick +
          (.14+.13*backHalf)*flashKick);
        glowCtx.globalCompositeOperation='screen';
        glowCtx.fillStyle=hsl(baseHueB + 48*dropKick,100,Math.min(92,60+18*backHalf+8*flashKick),impactAlpha);
        glowCtx.fillRect(0,0,w,h);

        // A soft central blast gives the largest drops a physical expansion.
        if(flashKick > .16){
          const fr=minDim*(.52+.20*Math.min(1.4,flashKick));
          const fg=glowCtx.createRadialGradient(w/2,h/2,0,w/2,h/2,fr);
          fg.addColorStop(0,hsl(baseHueA+18,100,Math.min(94,76+8*backHalf),Math.min(.58,.16+.21*flashKick)));
          fg.addColorStop(.34,hsl(baseHueB+36,100,Math.min(86,65+12*backHalf),Math.min(.40,.10+.15*flashKick)));
          fg.addColorStop(1,hsl(baseHueB,100,55,0));
          glowCtx.fillStyle=fg;
          glowCtx.fillRect(w/2-fr,h/2-fr,fr*2,fr*2);
        }
      }

      glowFrame=requestAnimationFrame(drawGlow);
    }

    function activateGlow(){
      if(glowActive) return;
      glowActive=true;
      resizeGlow();
      glowScreen.classList.add('active');
      glowScreen.setAttribute('aria-hidden','false');
      const alreadyFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
      fullscreenButton.classList.toggle('hidden', alreadyFullscreen);
      glowFrame=requestAnimationFrame(drawGlow);
    }

    function deactivateGlow(){
      glowActive=false;
      if(glowFrame){ cancelAnimationFrame(glowFrame); glowFrame=null; }
      glowScreen.classList.remove('active');
      glowScreen.setAttribute('aria-hidden','true');
      glowResume.classList.add('hidden');
      fullscreenButton.classList.add('hidden');
    }

    function showGlowResume(show){
      glowResume.classList.toggle('hidden', !show);
    }

    window.addEventListener('resize', ()=>{ if(glowActive) resizeGlow(); });

    // Emergency/test escape: five quick taps anywhere on the glow reveals the
    // normal player again. Deliberately obscure enough not to happen in use.
    glowScreen.addEventListener('pointerup', (ev)=>{
      if(ev.target === glowResume || ev.target === fullscreenButton) return;
      const now=performance.now();
      glowTapTimes=glowTapTimes.filter(t=>now-t<3000);
      glowTapTimes.push(now);
      if(glowTapTimes.length>=5){ glowTapTimes=[]; deactivateGlow(); }
    });

    fullscreenButton.addEventListener('click', async ()=>{
      await requestGlowFullscreen();
      fullscreenButton.classList.add('hidden');
    });

    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState === 'visible' && glowActive && fullscreenButton.classList.contains('hidden')){
        requestGlowWakeLock();
      }
    });

    glowResume.addEventListener('click', ()=>{
      showGlowResume(false);
      if(startNowMode === "resume"){
        handleResumeTap();
      }else{
        handleManualStart();
      }
    });
    // ---------------------------------------------------------------------

    let countdownFrame = null;
    let countdownTimer = null;
    let readinessInterval = null;
    let driftInterval = null;
    let transportInterval = null;
    let crossfadeInterval = null;

    let scheduledAnchorMs = null;
    let sourceAssigned = false;
    let preshowSourceAssigned = false;
    let preshowPlaying = false;
    let waitingForManualStart = false;
    let startAttempted = false;
    let lastDriftSec = 0;
    let lastHardSeekAtMs = 0;
    let initialDriftSec = null;
    let driftSampleCount = 0;
    let driftAbsSumSec = 0;
    let bestAbsDriftSec = null;
    let worstAbsDriftSec = null;
    let hardSeekCount = 0;
    let lastSeekBeforeSec = null;
    let lastSeekAfterSec = null;
    let lastSuccessfulHardSeekAtMs = null;
    let lastSeekAfter1Sec = null;
    let lastSeekAfter3Sec = null;
    let lastRecoveryBiasSec = null;
    let lastRecoveryBiasMode = "—";
    let startupObservationToken = 0;
    let startupObservationActive = false;
    let startupObservedCorrectionState = "—";
    let startupObservedCorrectionBiasSec = null;
    let startupObservedCorrectionSamplesMs = [];
    let seekSettlingToken = 0;
    let samplesUnder150 = 0;
    let samplesUnder250 = 0;
    let samplesUnderThreshold = 0;
    let samplesAtOrAboveThreshold = 0;
    let sustainedBadStreak = 0;
    let serverClockOffsetMs = 0;
    let lastClockSyncDebug = "";
    let performanceClockFrozen = false;
    let frozenSyncedEpochMs = null;
    let frozenPerformanceNowMs = null;
    let networkWasOnlineAtCurtain = null;
    let startNowMode = "begin";
    let interruptionRecoveryTimer = null;
    let interruptionRecoveryInFlight = false;
    let interruptionAwaitingTap = false;
    let interruptionCount = 0;
    let interruptionAutoRecoveries = 0;
    let interruptionManualRecoveries = 0;

    let timingOperationId = 0;
    let pendingTimingOperation = null;
    let latestStartTiming = null;
    let latestRecoveryTiming = null;

    // Preparation watchdog/diagnostics. Keep loading failures bounded and visible,
    // especially on iOS where media play() can remain pending on weak networks.
    let preparationStatusTimer = null;
    let preparationStageStartedAtMs = null;
    let preparationAttemptCount = 0;
    let preparationAttemptStartedAtMs = null;
    let currentPreparationStage = null;
    let lastPreparationOutcome = null;

    // v4.3.2: Safari/iOS can require AudioContext.resume() to be INVOKED
    // synchronously inside a trusted user gesture. We therefore launch the
    // output-path probe at the very beginning of the audience's Begin tap,
    // before clock/metadata awaits can consume user activation.
    let gestureOutputProbePromise = null;

    let startupCalibrationBiasSec = 0;
    let startupCalibrationMeasured = false;
    let startupCalibrationRealElapsedMs = null;
    let startupCalibrationMediaElapsedMs = null;
    let startupPipelineLossSec = 0;
    let startupCalibrationPasses = [];

    // Output-path awareness. We do not identify AirPods/Bluetooth/etc. by name.
    // When the browser exposes Web Audio outputLatency, we use that estimate
    // as the acoustic delay between the browser handing off audio and sound
    // actually emerging from the selected output device.
    let outputLatencyContext = null;
    let outputLatencySec = 0;
    let outputLatencySupported = false;

    const START_BUFFER_SEC = 15;
    const LATE_JOIN_BUFFER_SEC = 1.0;
    const SEEK_PLAYABLE_TIMEOUT_MS = 12000;

    const READINESS_CHECK_MS = 500;
    const DRIFT_CHECK_MS = 1000;
    const TRANSPORT_UPDATE_MS = 1000;

    // Production philosophy (Aug 2026): minimum intervention + network indifference.
    // Normal media URL remains intact; the browser is allowed to warm its own media cache/buffer.
    // 350 ms remains the preferred operating band for diagnostics.
    // A hard seek now requires a sustained poor state: >=420 ms for
    // three consecutive 1-second checks, plus the existing cooldown.
    // After six successful hard seeks, the controller concedes for the rest of the run
    // and prioritizes uninterrupted playback over further correction attempts.
    const PREFERRED_DRIFT_BAND_SEC = 0.35;
    const HARD_SEEK_TRIGGER_SEC = 0.42;
    const HARD_SEEK_REQUIRED_CHECKS = 3;
    const HARD_SEEK_COOLDOWN_MS = 8000;
    const HARD_SEEK_MAX_COUNT = 6;
    // EXPERIMENT: pre-curtain device/run calibration.
    // No platform sniffing and no universal fixed bias. During preparation,
    // the main track briefly runs muted and measures how much media time is
    // lost while the playback pipeline settles. The real start then aims ahead
    // by that measured amount.
    const START_CALIBRATION_SAMPLE_MS = 1200;
    const START_CALIBRATION_MAX_BIAS_SEC = 0.75;
    const OUTPUT_LATENCY_MAX_SEC = 1.5;
    // v4.5: an asynchronous media seek can itself take long enough that the
    // canonical show target becomes stale before playback begins. After each
    // startup seek, re-check the live show clock and, if necessary, retarget.
    // Keep this bounded so a pathological browser can never trap us in a seek loop.
    const START_TARGET_STALE_SEC = 0.25;
    const START_RETARGET_MAX_COUNT = 2;

    // v4.6 foundation: if the first sustained bad state appears immediately
    // after startup, treat the observed drift itself as an empirical estimate
    // of the newly-established playback-path lag. Use that measured lag once
    // as the recovery seek bias, rather than the browser's outputLatency.
    // This stays platform-agnostic and bounded.
    const STARTUP_SETTLING_RECOVERY_WINDOW_MS = 10000;
    const OBSERVED_RECOVERY_MAX_BIAS_SEC = 0.75;

    // v4.98: platform-agnostic observed-startup correction experiment.
    // v4.9 showed that outputLatency is useful as a
    // diagnostic but does not reliably predict the settled main-audio startup
    // offset. Instead, let the actual media path establish itself, sample the
    // settled startup plateau, and correct that observed offset exactly once.
    //
    // Samples begin at 1 s because the first ~500 ms can be a moving transition.
    // While this observation is active, the generic sustained-drift controller
    // stands down so it cannot race the one-shot startup correction.
    const STARTUP_OBSERVATION_DELAYS_MS = [1000, 1500, 2000];
    const STARTUP_OBSERVATION_MAX_SPREAD_SEC = 0.06;
    const STARTUP_OBSERVATION_MIN_BIAS_SEC = 0.08;
    // v4.98 experiment: correct 100% of a stable observed startup plateau.
    // Probe full correction after v4.97 at 95% repeatedly left a small positive
    // residual on the current Android speaker/headphone paths.
    const STARTUP_OBSERVED_CORRECTION_FACTOR = 1.00;
    const POST_SEEK_SETTLING_GRACE_MS = 1500;
    const NORMAL_RATE = 1.0;
    const INTERRUPTION_RECOVERY_DELAY_MS = 1800;
    const INTERRUPTION_VERIFY_DELAY_MS = 500;

    const PRESHOW_VOLUME = 1.0;
    const MAIN_VOLUME = 1.0;
    const CROSSFADE_MS = 1000;
    const FADE_STEP_MS = 50;

    function highResNowMs(){
      return performance.timeOrigin + performance.now();
    }

    function syncedNowMs(){
      if(performanceClockFrozen && frozenSyncedEpochMs != null && frozenPerformanceNowMs != null){
        return frozenSyncedEpochMs + (performance.now() - frozenPerformanceNowMs);
      }

      return highResNowMs() + serverClockOffsetMs;
    }

    function freezePerformanceClock(){
      if(performanceClockFrozen) return;

      frozenSyncedEpochMs = highResNowMs() + serverClockOffsetMs;
      frozenPerformanceNowMs = performance.now();
      performanceClockFrozen = true;
      networkWasOnlineAtCurtain = navigator.onLine;
    }

    function unfreezePerformanceClock(){
      performanceClockFrozen = false;
      frozenSyncedEpochMs = null;
      frozenPerformanceNowMs = null;
      networkWasOnlineAtCurtain = null;
    }

    function setStatus(msg){
      statusEl.textContent = msg;
    }

    function setCountdown(msg){
      countdownEl.textContent = msg;
      const numeric = Number(msg);
      if(msg === ""){
        glowCountdownEl.textContent = "";
        glowCountdownEl.classList.remove("fadeZero");
        glowCountdownEl.style.opacity = "1";
        return;
      }
      glowCountdownEl.textContent = String(Math.max(0, Math.ceil(numeric || 0)));
      glowCountdownEl.classList.remove("fadeZero");
      glowCountdownEl.style.opacity = "1";
    }

    function setDebug(msg){
      debugEl.textContent = msg || "";
    }

    function msBetween(a, b){
      if(a == null || b == null) return null;
      return Math.round(b - a);
    }

    function fmtMs(value){
      return value == null ? "—" : `${value} ms`;
    }

    function beginTimingOperation(kind){
      const now = highResNowMs();
      const op = {
        id: ++timingOperationId,
        kind,
        calculatedAtMs: now,
        seekAssignedAtMs: null,
        seekedAtMs: null,
        playCalledAtMs: null,
        playResolvedAtMs: null,
        playingEventAtMs: null,
        expectedAtCalculationSec: getExpectedTrackTimeSec(),
        mediaAtCalculationSec: audio.currentTime || 0,
        residualAtPlayingSec: null,
        startupRetargetCount: 0,
        startupMaxTargetAgeMs: 0,
        settlingSamplesMs: {}
      };
      pendingTimingOperation = op;
      updateTimingProbe();
      return op;
    }

    function finishTimingOperation(op){
      if(!op) return;
      if(op.kind === "start"){
        latestStartTiming = op;
      }else if(op.kind === "recovery"){
        latestRecoveryTiming = op;
      }
      if(pendingTimingOperation && pendingTimingOperation.id === op.id){
        pendingTimingOperation = null;
      }
      updateTimingProbe();
    }

    function timingSummary(label, op){
      if(!op) return `${label}: —`;

      const calcToSeek = msBetween(op.calculatedAtMs, op.seekAssignedAtMs);
      const seekWait = msBetween(op.seekAssignedAtMs, op.seekedAtMs);
      const seekToPlay = msBetween(op.seekedAtMs, op.playCalledAtMs);
      const playPromise = msBetween(op.playCalledAtMs, op.playResolvedAtMs);
      const calcToPlaying = msBetween(op.calculatedAtMs, op.playingEventAtMs);
      const residualMs = op.residualAtPlayingSec == null ? null : Math.round(op.residualAtPlayingSec * 1000);

      const s = op.settlingSamplesMs || {};
      const settlingText =
        `0 ${fmtMs(residualMs)} · 100 ${fmtMs(s[100])} · 250 ${fmtMs(s[250])} · ` +
        `500 ${fmtMs(s[500])} · 1s ${fmtMs(s[1000])} · 2s ${fmtMs(s[2000])} · ` +
        `3s ${fmtMs(s[3000])} · 5s ${fmtMs(s[5000])}`;

      const retargetText = op.kind === "start"
        ? ` · retargets ${op.startupRetargetCount || 0} · max target age ${fmtMs(op.startupMaxTargetAgeMs || 0)}`
        : "";

      return `${label}: calc→seek ${fmtMs(calcToSeek)} · seek ${fmtMs(seekWait)} · seek→play ${fmtMs(seekToPlay)} · play promise ${fmtMs(playPromise)} · calc→playing ${fmtMs(calcToPlaying)}${retargetText}<br>` +
        `${label} settling: ${settlingText}`;
    }

    function scheduleSettlingSamples(op){
      if(!op || op.playingEventAtMs == null) return;

      const delays = [100, 250, 500, 1000, 2000, 3000, 5000];

      for(const delay of delays){
        setTimeout(()=>{
          if(audio.ended) return;
          const driftMs = Math.round(getCurrentDriftSec() * 1000);
          op.settlingSamplesMs[delay] = driftMs;
          updateTimingProbe();
        }, delay);
      }
    }

    function calibrationProbeSummary(){
      const outputText = outputLatencySupported
        ? `${Math.round(outputLatencySec * 1000)} ms`
        : "unavailable";

      if(!startupCalibrationMeasured){
        return `Output latency: ${outputText}<br>Pre-curtain calibration: —`;
      }

      const pipelineLossMs = Math.round(startupPipelineLossSec * 1000);
      const biasMs = Math.round(startupCalibrationBiasSec * 1000);
      const passText = startupCalibrationPasses.length
        ? startupCalibrationPasses.map((p, i)=>`pass ${i + 1}: real ${fmtMs(p.realMs)} · media ${fmtMs(p.mediaMs)} · loss ${Math.round(p.lossSec * 1000)} ms`).join("<br>")
        : "passes —";
      return `Output latency: ${outputText}<br>` +
        `Warm-transfer calibration:<br>${passText}<br>` +
        `chosen pipeline loss ${pipelineLossMs} ms · start bias ${biasMs} ms<br>` +
        `v4.98 experiment: output latency diagnostic only; stable startup plateau corrected at 100%`;
    }

    function clampLatencySec(value){
      if(!Number.isFinite(value) || value < 0) return 0;
      return Math.min(OUTPUT_LATENCY_MAX_SEC, value);
    }

    function refreshOutputLatencyEstimate(){
      if(!outputLatencyContext) return outputLatencySec;

      try{
        const candidate = outputLatencyContext.outputLatency;
        if(Number.isFinite(candidate) && candidate >= 0){
          outputLatencySec = clampLatencySec(candidate);
          outputLatencySupported = true;
        }
      }catch(err){
        // Keep the last good estimate. Output-latency support is optional.
      }

      return outputLatencySec;
    }

    async function prepareOutputLatencyProbe(){
      const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
      if(!AudioContextCtor) return false;

      try{
        if(!outputLatencyContext){
          outputLatencyContext = new AudioContextCtor({ latencyHint: "playback" });
        }

        if(outputLatencyContext.state === "suspended"){
          await outputLatencyContext.resume();
        }

        // Give the context a moment to bind to the currently selected output.
        await new Promise(resolve=>setTimeout(resolve, 80));
        refreshOutputLatencyEstimate();
        updateTimingProbe();
        return outputLatencySupported;
      }catch(err){
        outputLatencySupported = false;
        outputLatencySec = 0;
        updateTimingProbe();
        return false;
      }
    }

        : `Preparation: —`;

      timingProbeEl.innerHTML =
        `${preparationText}<br>` +
        `${calibrationProbeSummary()}<br>` +
        `${timingSummary("Start", latestStartTiming)}<br>` +
        `${timingSummary("Recovery", latestRecoveryTiming)}<br>` +
        pendingText;
    }
